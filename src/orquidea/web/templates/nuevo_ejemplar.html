{% extends "base.html" %}
{% block title %}Planta fuera del catálogo — Orquídea{% endblock %}
{% block content %}
<p><a href="/coleccion">Mi colección</a></p>
<h1>Planta fuera del catálogo</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/coleccion/nuevo">
  {% include "_csrf.html" %}
  <p>
    <label for="nombre">Nombre</label>
    <input id="nombre" name="nombre" value="{{ nombre }}" maxlength="120" required>
  </p>
  <p>
    <label for="notas">Notas</label>
    <textarea id="notas" name="notas" rows="5" maxlength="2000">{{ notas }}</textarea>
  </p>
  <button type="submit">Agregar a mi colección</button>
</form>
{% endblock %}
