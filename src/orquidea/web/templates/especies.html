{% extends "base.html" %}
{% block title %}Especies — Orquídea{% endblock %}
{% block content %}
<h1>Especies</h1>
{% if especies %}
<ul>
  {% for especie in especies %}
  <li><a href="/especies/{{ especie.id }}">{{ especie.nombre_cientifico }}</a></li>
  {% endfor %}
</ul>
{% else %}
<p>Aún no hay especies en el catálogo.</p>
{% endif %}
{% endblock %}
