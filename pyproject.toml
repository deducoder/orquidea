[project]
name = "orquidea"
version = "0.1.0"
description = "Catálogo de orquídeas nativas de Chiapas y seguimiento de una colección personal."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx2>=2.13.0",
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
